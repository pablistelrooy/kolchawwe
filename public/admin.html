<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Kolchawwe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1a1613; color: #f4e9d5; }
        h3, h2, .brand-font { font-family: 'Playfair Display', serif; }
        
        .card-variety {
            background-color: #0b0a09;
            border: 1px solid #332d28;
            border-top: 4px solid #b38e44;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .client-row {
            border-bottom: 1px solid #332d28;
            transition: background-color 0.2s;
        }
        .client-row:hover {
            background-color: rgba(179, 142, 68, 0.05);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navegación -->
    <nav class="bg-black border-b border-[#332d28] sticky top-0 z-50 h-16 flex items-center shadow-xl">
        <div class="max-w-4xl mx-auto px-6 w-full flex justify-between items-center text-[#b38e44]">
            <span class="font-bold tracking-widest uppercase text-sm">KOLCHAWWE <span class="text-[10px] text-zinc-500 ml-2 tracking-normal">PANEL DE CONTROL</span></span>
            <a href="/" class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 hover:text-[#b38e44] transition">Tienda</a>
        </div>
    </nav>

    <main class="p-6 max-w-4xl mx-auto">
        
        <!-- Sección de Login -->
        <div class="max-w-sm mx-auto mt-10">
            <section id="login-section" class="bg-black p-8 rounded-3xl border border-zinc-800 text-center shadow-2xl">
                <h2 class="text-xl font-bold text-[#b38e44] mb-6 italic">Acceso Maestro</h2>
                <div class="space-y-4">
                    <input type="password" id="adminPass" placeholder="Clave de Seguridad" 
                           class="w-full bg-zinc-900 border border-[#332d28] rounded-xl p-3 text-2xl text-center text-[#b38e44] tracking-widest outline-none focus:border-[#b38e44]">
                    <button onclick="verificarAcceso()" class="w-full bg-[#b38e44] text-black font-black p-4 rounded-xl hover:bg-amber-500 transition active:scale-95 shadow-lg">
                        INGRESAR
                    </button>
                </div>
            </section>
        </div>

        <!-- Panel de Administración -->
        <div id="admin-panel" class="hidden mt-6">
            <div class="flex justify-center gap-4 mb-8">
                <button id="btn-tab-stock" onclick="switchTab('stock')" 
                        class="px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-[#b38e44] text-black transition-all">
                    <i class="fas fa-boxes mr-2"></i> Gestión de Stock
                </button>
                <button id="btn-tab-clientes" onclick="switchTab('clientes')" 
                        class="px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-[#b38e44] transition-all">
                    <i class="fas fa-users mr-2"></i> Clientes Registrados
                </button>
            </div>

            <!-- Contenedor Stock -->
            <div id="tab-stock-content" class="block">
                <div id="status-msg-stock" class="text-center py-10 text-[#b38e44] font-bold">Cargando variedades...</div>
                <div id="inventario-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>

            <!-- Contenedor Clientes -->
            <div id="tab-clientes-content" class="hidden">
                <div id="status-msg-clientes" class="text-center py-10 text-[#b38e44] font-bold">Cargando base de datos...</div>
                
                <div class="bg-black border border-[#332d28] rounded-2xl p-6 shadow-2xl overflow-x-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-bold text-[#b38e44] italic">Historial de Clientes</h3>
                        <div class="flex gap-2">
                            <button onclick="descargarCSV()" class="text-xs bg-emerald-900 hover:bg-emerald-800 text-emerald-100 border border-emerald-700 px-3 py-2 rounded-lg transition flex items-center gap-1">
                                <i class="fas fa-file-csv"></i> Descargar Planilla
                            </button>
                            <button onclick="cargarClientes()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-[#b38e44] border border-[#332d28] px-3 py-2 rounded-lg transition flex items-center gap-1">
                                <i class="fas fa-sync-alt"></i> Actualizar
                            </button>
                        </div>
                    </div>

                    <div class="mb-6 relative">
                        <i class="fas fa-search absolute left-3 top-3 text-zinc-500"></i>
                        <input type="text" id="busquedaCliente" oninput="filtrarPorInicial()" placeholder="Buscar por inicial..." 
                               class="w-full bg-zinc-900 border border-[#332d28] pl-10 pr-3 py-3 rounded-lg text-white outline-none focus:border-[#b38e44] text-xs transition">
                    </div>
                    
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="border-b border-[#332d28] text-zinc-500 text-[10px] uppercase tracking-wider">
                                <th class="pb-3 font-bold">ID</th>
                                <th class="pb-3 font-bold">Nombre</th>
                                <th class="pb-3 font-bold">RUT</th>
                                <th class="pb-3 font-bold">Teléfono</th>
                                <th class="pb-3 font-bold">Dirección</th>
                                <th class="pb-3 font-bold text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="clientes-container" class="text-xs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 transition-all duration-500 z-50 w-full max-w-xs text-center">
        <div id="toast-content" class="bg-[#b38e44] text-black px-6 py-4 rounded-2xl font-black shadow-2xl border-2 border-amber-400 uppercase text-xs"></div>
    </div>

    <script>
        const API_URL = 'https://kolchawwe-web.onrender.com';
        let listaGlobalClientes = [];

        function verificarAcceso() {
            const pass = document.getElementById('adminPass').value;
            if (pass.trim() === "1234") {
                document.getElementById('login-section').parentElement.classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                cargarInventario();
                cargarClientes();
            } else {
                notificar("⛔ CLAVE INCORRECTA", true);
            }
        }

        function switchTab(tab) {
            const tabStockBtn = document.getElementById('btn-tab-stock');
            const tabClientesBtn = document.getElementById('btn-tab-clientes');
            const stockContent = document.getElementById('tab-stock-content');
            const clientesContent = document.getElementById('tab-clientes-content');

            if (tab === 'stock') {
                tabStockBtn.className = "px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-[#b38e44] text-black transition-all";
                tabClientesBtn.className = "px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-[#b38e44] transition-all";
                stockContent.classList.replace('hidden', 'block');
                clientesContent.classList.replace('block', 'hidden');
            } else {
                tabClientesBtn.className = "px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-[#b38e44] text-black transition-all";
                tabStockBtn.className = "px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-[#b38e44] transition-all";
                clientesContent.classList.replace('hidden', 'block');
                stockContent.classList.replace('block', 'hidden');
            }
        }

        async function cargarInventario() {
            try {
                const response = await fetch(`${API_URL}/api/cervezas`);
                const cervezas = await response.json();
                const container = document.getElementById('inventario-container');
                document.getElementById('status-msg-stock').classList.add('hidden');
                container.innerHTML = '';
                cervezas.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'card-variety';
                    div.innerHTML = `
                        <h3 class="text-2xl font-bold text-[#b38e44] italic text-center mb-4">${c.nombre}</h3>
                        <div class="space-y-4">
                            <input type="number" id="precio-${c.id}" value="${c.precio}" class="w-full bg-[#1a1613] border border-[#332d28] rounded-lg p-2 text-white font-black text-center text-xl outline-none focus:border-[#b38e44]">
                            <input type="number" id="stock-${c.id}" value="${c.stock}" class="w-full bg-[#1a1613] border border-[#332d28] rounded-lg p-2 text-white font-black text-center text-xl outline-none focus:border-[#b38e44]">
                            <button onclick="guardar(${c.id}, '${c.nombre}')" class="w-full bg-[#b38e44] text-black font-black py-3 rounded-lg hover:bg-amber-500 transition uppercase text-sm border-b-4 border-amber-850">Guardar Cambios</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { document.getElementById('status-msg-stock').innerText = "❌ ERROR: Servidor no responde"; }
        }

        async function cargarClientes() {
            try {
                const res = await fetch(`${API_URL}/api/clientes`);
                if(res.ok) {
                    listaGlobalClientes = await res.json();
                    document.getElementById('status-msg-clientes').classList.add('hidden');
                    renderizarClientes(listaGlobalClientes);
                }
            } catch (e) { notificar("❌ Error al cargar clientes", true); }
        }

        function renderizarClientes(data) {
            const container = document.getElementById('clientes-container');
            container.innerHTML = '';
            data.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = 'client-row';
                tr.innerHTML = `
                    <td class="py-4 font-bold text-zinc-500">#${c.id}</td>
                    <td class="py-4 font-semibold text-white">${c.nombre}</td>
                    <td class="py-4 text-zinc-300 font-mono">${c.rut || 'N/A'}</td>
                    <td class="py-4 text-zinc-300">${c.telefono}</td>
                    <td class="py-4 text-zinc-400 italic">${c.direccion}</td>
                    <td class="py-4 text-center"><button onclick="eliminarCliente(${c.id})" class="text-red-500"><i class="fas fa-trash-alt"></i></button></td>
                `;
                container.appendChild(tr);
            });
        }

        function descargarCSV() {
            if (listaGlobalClientes.length === 0) return notificar("No hay datos para exportar", true);
            let csv = "ID,Nombre,RUT,Telefono,Direccion\n";
            listaGlobalClientes.forEach(c => {
                csv += `${c.id},"${c.nombre}","${c.rut}","${c.telefono}","${c.direccion}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'clientes_kolchawwe.csv';
            a.click();
            notificar("✅ DESCARGANDO PLANILLA...");
        }

        function notificar(msg, error = false) {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toast-content');
            content.innerText = msg;
            content.className = `px-6 py-4 rounded-2xl font-black shadow-2xl border-2 uppercase text-xs ${error ? 'bg-red-750 text-white border-red-500' : 'bg-[#b38e44] text-black border-amber-400'}`;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }
    </script>
</body>
</html>
